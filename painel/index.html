<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBS distribuído — painel</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --tx:#1b1f24; --mut:#6b7280; --bd:#e5e7eb;
          --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;
          --warn:#b45309; --warnbg:#fef3c7; --info:#1d4ed8; --infobg:#dbeafe; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#171a21; --tx:#e6e8eb; --mut:#9aa3af; --bd:#2a2f3a;
            --ok:#4ade80; --okbg:#14532d; --bad:#f87171; --badbg:#7f1d1d;
            --warn:#fbbf24; --warnbg:#78350f; --info:#60a5fa; --infobg:#1e3a8a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--tx);
         font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; font-weight:600; }
  h2 { font-size:13px; margin:0 0 10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
  .mut { color:var(--mut); }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:14px; }
  .grid { display:grid; gap:12px; }
  .servers { grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); margin-bottom:12px; }
  .cols { grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); }
  .srv.caiu { border-color:var(--bad); opacity:.75; }
  .srv .nome { font-size:17px; font-weight:600; }
  .srv .linha { display:flex; justify-content:space-between; padding:3px 0; border-top:1px solid var(--bd); }
  .srv .linha:first-of-type { border-top:0; }
  .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; margin-left:4px; }
  .b-ok { background:var(--okbg); color:var(--ok); } .b-bad { background:var(--badbg); color:var(--bad); }
  .b-info { background:var(--infobg); color:var(--info); } .b-warn { background:var(--warnbg); color:var(--warn); }
  .banner { margin-bottom:12px; padding:10px 14px; border-radius:10px; font-weight:500; }
  .lista { max-height:340px; overflow:auto; }
  .item { padding:5px 0; border-top:1px solid var(--bd); }
  .item:first-child { border-top:0; }
  .item .h { color:var(--mut); font-variant-numeric:tabular-nums; margin-right:8px; }
  .nivel-alerta { color:var(--bad); font-weight:600; } .nivel-ok { color:var(--ok); } .nivel-info { color:var(--info); }
  .canal { color:var(--info); font-weight:600; }
  .tags span { display:inline-block; margin:2px 6px 2px 0; padding:2px 8px; border:1px solid var(--bd); border-radius:999px; }
</style>
</head>
<body>
<header>
  <h1>BBS distribuído — painel</h1>
  <div class="mut" id="resumo">conectando…</div>
</header>
<div id="banner"></div>
<div class="grid servers" id="servidores"></div>
<div class="grid cols">
  <div class="card"><h2>Eventos</h2><div class="lista" id="eventos"></div></div>
  <div class="card"><h2>Mensagens recentes</h2><div class="lista" id="mensagens"></div></div>
  <div class="card"><h2>Canais</h2><div class="tags" id="canais"></div></div>
</div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(e) {
  document.getElementById("resumo").textContent =
    `${e.total} mensagens vistas • no ar há ${e.uptime}s • atualiza a cada 1 s`;

  // faixa de situação: coordenador + réplicas
  let html = "";
  if (e.coordenador) {
    const cls = e.coordenador_caiu ? "b-bad" : "b-info";
    const nota = e.coordenador_caiu ? " (fora do ar — eleição em andamento)" : "";
    html += `<div class="banner ${e.coordenador_caiu ? "b-bad" : "b-info"}">Coordenador: <b>${esc(e.coordenador)}</b>${nota}</div>`;
  }
  const ativos = e.servidores.filter((s) => s.estado === "ativo").length;
  if (e.servidores.length) {
    html += e.replicas_iguais
      ? `<div class="banner b-ok">Réplicas sincronizadas: os ${ativos} servidores ativos têm os mesmos dados</div>`
      : `<div class="banner b-warn">Réplicas convergindo: diferença de ${e.diferenca} mensagens entre os servidores ativos</div>`;
  }
  document.getElementById("banner").innerHTML = html;

  // cartões dos servidores
  document.getElementById("servidores").innerHTML = e.servidores.map((s) => `
    <div class="card srv ${s.estado}">
      <div><span class="nome">${esc(s.nome)}</span>
        <span class="badge ${s.estado === "ativo" ? "b-ok" : "b-bad"}">${s.estado === "ativo" ? "ATIVO" : "FORA DO AR"}</span>
        ${s.coordenador ? '<span class="badge b-info">COORDENADOR</span>' : ""}</div>
      <div class="linha"><span class="mut">rank</span><span>${esc(s.rank)}</span></div>
      <div class="linha"><span class="mut">enxerga o coordenador</span><span>${esc(s.visao || "—")}</span></div>
      <div class="linha"><span class="mut">ajuste do relógio</span><span>${s.offset_ms >= 0 ? "+" : ""}${s.offset_ms} ms</span></div>
      <div class="linha"><span class="mut">logins / canais / mensagens</span><span>${s.logins} / ${s.canais} / <b>${s.mensagens}</b></span></div>
      <div class="linha"><span class="mut">último sinal</span><span>há ${s.visto_ha}s</span></div>
    </div>`).join("") || '<div class="card mut">aguardando os servidores…</div>';

  document.getElementById("eventos").innerHTML = e.eventos.map((x) =>
    `<div class="item"><span class="h">${esc(x.hora)}</span><span class="nivel-${esc(x.nivel)}">${esc(x.texto)}</span></div>`
  ).join("") || '<span class="mut">sem eventos ainda</span>';

  document.getElementById("mensagens").innerHTML = e.mensagens.map((m) =>
    `<div class="item"><span class="h">${esc(m.hora)}</span><span class="canal">${esc(m.canal)}</span> <b>${esc(m.usuario)}</b>: ${esc(m.texto)}</div>`
  ).join("") || '<span class="mut">sem mensagens ainda</span>';

  document.getElementById("canais").innerHTML = e.canais.map(([c, n]) =>
    `<span><span class="canal">${esc(c)}</span> ${n}</span>`).join("") || '<span class="mut">nenhum canal com mensagens</span>';
}

async function atualizar() {
  try {
    const r = await fetch("/estado");
    render(await r.json());
  } catch (err) {
    document.getElementById("resumo").textContent = "sem conexão com o painel";
  }
}
atualizar();
setInterval(atualizar, 1000);
</script>
</body>
</html>
