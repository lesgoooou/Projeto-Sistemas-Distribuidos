services:
  broker:
    build: ./broker          # ROUTER :5555 (bots) <-> DEALER :5556 (servidores)

  server1:
    build: ./servidor
    environment:
      SERVER_NAME: server1
    volumes:
      - ./data/server1:/data
    depends_on: [broker]

  server2:
    build: ./servidor
    environment:
      SERVER_NAME: server2
    volumes:
      - ./data/server2:/data
    depends_on: [broker]

  bot1:
    build: ./bot
    environment:
      BOT_NAME: bot1
    depends_on: [broker, server1, server2]

  bot2:
    build: ./bot
    environment:
      BOT_NAME: bot2
    depends_on: [broker, server1, server2]
